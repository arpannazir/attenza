<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101f38" />
    <title>ATTENZA — Leave</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,700;0,800;1,700&family=Space+Grotesk:wght@500;600;700&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
    <style>
        /* Lock the page itself from scrolling — only the fixed cards
           below (the applications list, and the form as a safety net)
           scroll internally. */
        html,
        body {
            height: 100%;
            overflow: hidden;
        }

        .home-shell {
            height: 100vh;
            overflow: hidden;
        }

        .home-main {
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .home-topbar,
        .home-top-row {
            flex: 0 0 auto;
        }

        /* ── Leave-specific styles ── */
        .leave-layout {
            display: grid;
            grid-template-columns: minmax(300px, 380px) 1fr;
            gap: 20px;
            align-items: stretch;
            flex: 1 1 auto;
            min-height: 0;
        }

        @media (max-width: 900px) {
            .leave-layout {
                grid-template-columns: 1fr;
            }
        }

        .leave-form-panel,
        .leave-history-panel {
            min-height: 0;
        }

        .leave-form-panel .home-panel {
            margin-bottom: 0;
            height: 100%;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .leave-history-panel .home-panel {
            height: 100%;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .leave-history-panel .home-panel h3 {
            flex: 0 0 auto;
        }

        .leave-field {
            margin-bottom: 16px;
        }

        .leave-field label {
            display: block;
            font: 600 10px "DM Mono", monospace;
            letter-spacing: .8px;
            color: var(--muted);
            margin-bottom: 6px;
        }

        .leave-field input[type="date"],
        .leave-field select,
        .leave-field textarea {
            width: 100%;
            border: 1px solid var(--line);
            background: #fff;
            padding: 10px 12px;
            font: 500 13px Manrope, sans-serif;
            color: var(--ink);
            box-sizing: border-box;
        }

        .leave-field input[type="date"]:focus,
        .leave-field select:focus,
        .leave-field textarea:focus {
            outline: none;
            border-color: var(--navy);
        }

        .leave-field textarea {
            resize: vertical;
            min-height: 76px;
            font-family: Manrope, sans-serif;
        }

        .leave-range-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .leave-days-note {
            font: 500 11px "DM Mono", monospace;
            color: var(--coral);
            margin: -6px 0 16px;
        }

        .leave-submit-status {
            font-size: 12px;
            margin-top: 10px;
            min-height: 16px;
        }

        .leave-submit-status.error {
            color: #c1554a;
        }

        .leave-submit-status.success {
            color: #2e7d53;
        }

        /* Leave request rows — colour-coded by status so the decision is
           readable at a glance, not just from the small chip. */
        .leave-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 14px;
            padding: 14px 16px;
            margin-bottom: 10px;
            border: 1px solid var(--line);
            border-left: 4px solid var(--line);
            background: #fff;
        }

        .leave-row:last-child {
            margin-bottom: 0;
        }

        .leave-row.row-pending {
            background: #fdf8ef;
            border-color: #f0e2bf;
            border-left-color: #e4cb95;
        }

        .leave-row.row-approved {
            background: #f2f9f5;
            border-color: #cbe4d5;
            border-left-color: #7fbd9a;
        }

        .leave-row.row-rejected {
            background: #fdf2ef;
            border-color: #f4d3c8;
            border-left-color: #e79684;
        }

        .leave-row-main {
            font-weight: 600;
            font-size: 13px;
        }

        .leave-row-sub {
            display: block;
            font-size: 11px;
            color: var(--muted);
            margin-top: 3px;
        }

        .leave-row-reason {
            display: block;
            font-size: 12px;
            color: var(--ink);
            margin-top: 6px;
            max-width: 480px;
        }

        .leave-status-chip {
            flex: 0 0 auto;
            font: 600 9px "DM Mono", monospace;
            letter-spacing: .7px;
            padding: 4px 10px;
            border: 1px solid var(--line);
            white-space: nowrap;
        }

        .chip-pending {
            background: #fbf3e2;
            border-color: #e4cb95;
            color: #b8863a;
        }

        .chip-approved {
            background: #e6f5ec;
            border-color: #b9d9c6;
            color: #2e7d53;
        }

        .chip-rejected {
            background: #fdeee9;
            border-color: #f4c9bb;
            color: #c1554a;
        }

        .leave-list-scroll {
            flex: 1 1 auto;
            min-height: 0;
            overflow-y: auto;
            padding-right: 6px;
        }

        .leave-list-scroll::-webkit-scrollbar {
            width: 6px;
        }

        .leave-list-scroll::-webkit-scrollbar-thumb {
            background: var(--line);
            border-radius: 3px;
        }

        .leave-empty {
            text-align: center;
            padding: 36px 20px;
            color: var(--muted);
            font-size: 13px;
        }
    </style>
</head>

<body>
    <div class="home-shell">
        <aside class="sidebar" aria-label="Main navigation">
            <a class="sidebar-logo" href="home.html" title="ATTENZA Home">
                <span class="emblem-letter">A</span>
            </a>
            <nav class="sidebar-nav">
                <a class="sidebar-link" href="home.html">
                    <svg viewBox="0 0 24 24">
                        <path d="M3 11.5 12 4l9 7.5" />
                        <path d="M5.5 10v9.5h13V10" />
                        <path d="M9.5 19.5V13.5h5v6" />
                    </svg>
                    <span>HOME</span>
                </a>
                <a class="sidebar-link" href="history.html">
                    <svg viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="9" />
                        <path d="M12 7v5l3.3 2" />
                    </svg>
                    <span>HISTORY</span>
                </a>
                <a class="sidebar-link active" href="leave.html" aria-current="page">
                    <svg viewBox="0 0 24 24">
                        <rect x="3.5" y="5" width="17" height="15" rx="1.5" />
                        <path d="M3.5 9.5h17" />
                        <path d="M8 3v4M16 3v4" />
                        <path d="M8.5 13.5l2 2 4-4" />
                    </svg>
                    <span>LEAVE</span>
                </a>
                <button class="sidebar-link admin-link" id="adminLink" type="button" hidden>
                    <svg viewBox="0 0 24 24">
                        <path
                            d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" />
                    </svg>
                    <span>ADMIN</span>
                </button>
            </nav>
            <div class="sidebar-foot">
                <button class="sidebar-link" id="signOut" type="button" title="Sign out">
                    <svg viewBox="0 0 24 24">
                        <path d="M9 4H5.5a1.5 1.5 0 0 0-1.5 1.5v13A1.5 1.5 0 0 0 5.5 20H9" />
                        <path d="M16 16.5 21 12l-5-4.5" />
                        <path d="M21 12H9" />
                    </svg>
                    <span>SIGN OUT</span>
                </button>
            </div>
        </aside>

        <main class="home-main">
            <div class="home-topbar">
                <span class="date-chip" id="today"></span>
                <span class="secure"><b>●</b> SECURE SESSION</span>
            </div>

            <div class="home-top-row">
                <div class="home-greeting">
                    <p class="step-label">LEAVE</p>
                    <h1 id="leaveTitle">Apply for leave.</h1>
                    <p id="leaveSub">Loading your leave history…</p>
                </div>
            </div>

            <div class="leave-layout">
                <div class="leave-form-panel">
                    <section class="home-panel">
                        <h3>New application</h3>
                        <div class="leave-field leave-range-row">
                            <div>
                                <label for="leaveFrom">FROM</label>
                                <input type="date" id="leaveFrom" />
                            </div>
                            <div>
                                <label for="leaveTo">TO</label>
                                <input type="date" id="leaveTo" />
                            </div>
                        </div>
                        <p class="leave-days-note" id="leaveDaysNote">&nbsp;</p>
                        <div class="leave-field">
                            <label for="leaveType">TYPE</label>
                            <select id="leaveType">
                                <option value="Casual Leave">Casual Leave</option>
                                <option value="Sick Leave">Sick Leave</option>
                                <option value="Earned Leave">Earned Leave</option>
                                <option value="Unpaid Leave">Unpaid Leave</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                        <div class="leave-field">
                            <label for="leaveReason">REASON</label>
                            <textarea id="leaveReason"
                                placeholder="Briefly tell your admin why you need this leave."></textarea>
                        </div>
                        <button class="signin-btn" id="submitLeave" type="button">
                            <span>Send for approval</span><span class="arrow">→</span>
                        </button>
                        <p class="leave-submit-status" id="leaveSubmitStatus"></p>
                    </section>
                </div>

                <div class="leave-history-panel">
                    <section class="home-panel">
                        <h3>Your applications</h3>
                        <div class="leave-list-scroll" id="leaveList">
                            <p class="leave-empty">Loading…</p>
                        </div>
                    </section>
                </div>
            </div>
        </main>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <div class="signout-overlay" id="signoutOverlay" aria-hidden="true">
        <div class="signout-modal">
            <div class="spinner-wrapper">
                <div class="spinner-wheel"></div>
                <div class="spinner-icon">
                    <span class="emblem-letter">A</span>
                </div>
            </div>
            <p class="signout-label">Signing Out</p>
            <p class="signout-text">Closing session & saving attendance safely…</p>
        </div>
    </div>

    <script src="soundfx.js"></script>
    <script src="leave.js"></script>
</body>

</html>
